<title>Programación Semanal | Agrícola Santa Azul</title>
<style>
:root{
  --blue:#174a8b;--blue-dark:#0f376d;--blue-soft:#eaf2fb;
  --green:#2d9b4e;--ink:#18324f;--muted:#6b7f95;
  --line:#d8e2ec;--surface:#fff;--bg:#f6f9fc;--subtotal:#f2f6fb;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.page{max-width:1220px;margin:0 auto;padding:24px 18px 40px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--green)}
.brand{display:flex;gap:14px;align-items:center}
.mark{width:52px;height:52px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
.brand small{display:block;color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-bottom:4px}
.brand h1{margin:0;font-size:23px;color:var(--blue-dark)}
.weekbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.weekno{border-left:1px solid var(--line);padding-left:18px;min-width:110px}
.weekno span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.08em}
.weekno strong{display:block;font-size:28px;color:var(--blue);margin-top:2px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:10px;margin:16px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card span{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.05em}
.card strong{display:block;margin-top:5px;font-size:16px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 14px}
.left{display:flex;gap:10px;flex-wrap:wrap}
button,.filelabel{border:0;border-radius:10px;padding:11px 15px;font-weight:800;font-size:14px;cursor:pointer}
.filelabel{background:var(--blue);color:#fff;display:inline-flex;align-items:center}
.export{background:var(--green);color:#fff}.clear{background:#edf2f7;color:var(--ink)}
input[type=file]{display:none}.hint{font-size:12px;color:var(--muted)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:960px;font-size:13px}
thead th{background:var(--blue);color:#fff;padding:12px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
thead th.num{text-align:center;min-width:64px}.day{display:block;font-size:9px;opacity:.7;margin-top:3px}
tbody td{padding:10px;border-bottom:1px solid #edf2f7}
.fundo{font-weight:900;color:var(--blue-dark);background:var(--blue-soft);border-left:4px solid var(--blue)}
.jefe{font-weight:800;color:var(--green)}.area{color:#3f5368}.num{text-align:center}
.value{display:inline-block;min-width:34px;padding:3px 6px;border-radius:7px;font-weight:800;background:#f7fafc}
.value.zero{color:#a5b2bf;background:#f2f5f8}
.subtotal td{background:var(--subtotal);color:var(--blue-dark);font-weight:900;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.total td{background:var(--blue-dark);color:#fff;font-weight:900;font-size:14px}.total td:last-child{background:var(--green)}
.right{text-align:right}.status{font-size:12px;color:var(--muted);margin-top:10px}.empty{padding:34px;text-align:center;color:var(--muted)}
.signature{margin-top:14px;font-size:11px;color:#8a99a8;text-align:right}
@media(max-width:700px){.page{padding:14px 10px 28px}.meta{grid-template-columns:1fr}.weekno{border-left:0;padding-left:0}.left{width:100%}.left>*{flex:1;justify-content:center;text-align:center}}
</style>
</head>

<main class="page">
<section class="hero">

</section>
