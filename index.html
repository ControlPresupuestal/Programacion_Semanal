<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASA | IA - Programación</title>
<style>

color:#fff;padding:8px 6px;text-align:left;font-size:10px}td{padding:6px;border-bottom:1px solid #edf2f7}.num{text-align:center}.qty{width:55px;text-align:center;padding:7px}.sel{width:100%;min-width:145px;padding:7px}.lab{min-width:235px}.subtotal td{background:#f2f6fb;font-weight:900}.grand td{background:var(--bd);color:#fff;font-weight:900}.grand td:last-child{background:var(--g)}.empty{padding:35px;text-align:center;color:var(--mu)}.status{font-size:12px;color:var(--mu);padding:4px 12px 10px}.combo{position:relative}.list{display:none;position:absolute;z-index:20;background:#fff;border:1px solid var(--ln);left:0;right:0;max-height:230px;overflow:auto;box-shadow:0 8px 20px #0002}.list.open{display:block}.item{padding:8px;cursor:pointer}.item:hover{background:var(--sf)}@media(max-width:850px){.layout{grid-template-columns:1fr}.range{width:100%;margin-left:0}}
</style></head><body><div class="app">
<header class="top card"><div class="brand"><div class="logo">ASA | IA</div><div><small>AGRÍCOLA SANTA AZUL · INTERANDINA</small><h1>Programación de Personal</h1></div></div><div id="conn" class="conn">Conectando…</div></header>
<div class="weekbar card"><label>Año<br><select id="yr"></select></label><button id="prev" class="light">←</button><label>Semana<br><select id="wk"></select></label><button id="next" class="light">→</button><div id="range" class="range"></div></div>
<div class="layout"><aside class="side card"><h3>Programar</h3><label class="field">Jefatura<div class="combo"><input id="jefe" placeholder="Buscar o seleccionar…"><div id="jl" class="list"></div></div></label><label class="field">Fundo<select id="fundo"></select></label><label class="field">Área<select id="area"></select></label><button id="addArea" class="green add">＋ Agregar área</button><hr style="border:0;border-top:1px solid var(--ln);margin:16px 0"><small style="color:var(--mu)">Puedes agregar varias áreas y varias labores en cada una.</small></aside>
<section class="main card"><div class="toolbar"><button id="undo" class="light" title="Deshacer">↶</button><button id="redo" class="light" title="Rehacer">↷</button><button id="reset" class="light" title="Reiniciar">↻</button><button id="folder" class="light" title="Cargar programación desde CSV">📁</button><input id="csvLoad" type="file" accept=".csv,text/csv" style="display:none"><button id="save" class="green" title="Guardar">💾</button><button id="excel" class="light" title="Exportar Excel/CSV">XLS</button><button id="clear" class="red" title="Eliminar todo">🗑</button></div><div id="content" class="content"></div><div id="status" class="status"></div></section></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzho2PoUsUSvgxDGT8ZArzIl7gX6xXLFKBdqPwfL8snBXkLvygb2xlI-YsFOrdQ1SUP/exec';
let R=[],M=[],A=[],hist=[],fut=[],D=[];const $=x=>document.getElementById(x),N=s=>String(s??'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),U=a=>[...new Set(a.map(x=>String(x??'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function P(o,n){for(let z of n){let k=Object.keys(o||{}).find(x=>N(x)===N(z));if(k)return o[k]}return''}const mf=r=>P(r,['FUNDO']),ma=r=>P(r,['AREA','ÁREA']),mg=r=>P(r,['GRUPO LABOR','GRUPO_LABOR']),ml=r=>P(r,['LABOR']),mcg=r=>P(r,['COD G LABOR','COD_GRUPO_LABOR']),mcl=r=>P(r,['COD LABOR','COD_LABOR']),me=r=>P(r,['ESTADO']);
async function G(a){let r=await fetch(API+'?accion='+a+'&_='+Date.now()),j=await r.json();if(!j.ok)throw Error(j.mensaje);return j.datos||[]}function IW(d){let x=new Date(d),q=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-q);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function WIY(y){return IW(new Date(Date.UTC(y,11,28)))}function WD(y,w){let j=new Date(Date.UTC(y,0,4)),q=j.getUTCDay()||7,m=new Date(j);m.setUTCDate(j.getUTCDate()-q+1+(w-1)*7);return Array.from({length:7},(_,i)=>{let x=new Date(m);x.setUTCDate(m.getUTCDate()+i);return x})}const ISO=d=>d.toISOString().slice(0,10),SH=d=>new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'short'}).format(d).replace('.','');
function weeks(s){let y=+$('yr').value;$('wk').innerHTML=Array.from({length:WIY(y)},(_,i)=>'<option>'+(i+1)+'</option>').join('');$('wk').value=Math.min(s,WIY(y));setWeek()}function setWeek(){D=WD(+$('yr').value,+$('wk').value);$('range').textContent=SH(D[0])+' – '+SH(D[6])+' '+D[6].getUTCFullYear();render()}function initWeek(){let n=new Date(),d=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())),x=new Date(d),q=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-q);let y=x.getUTCFullYear();$('yr').innerHTML=[y-1,y,y+1].map(v=>'<option>'+v+'</option>').join('');$('yr').value=y;weeks(IW(d))}function shift(n){let y=+$('yr').value,w=+$('wk').value+n;if(w<1){y--;w=WIY(y)}if(w>WIY(y)){y++;w=1}if(![...$('yr').options].some(o=>+o.value===y))$('yr').add(new Option(y,y));$('yr').value=y;weeks(w)}
$('yr').onchange=()=>weeks(1);$('wk').onchange=setWeek;$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
function fill(e,v,p){e.innerHTML='<option value="">'+p+'</option>'+v.map(x=>'<option>'+E(x)+'</option>').join('')}function rf(){let j=$('jefe').value;fill($('fundo'),U(R.filter(r=>!j||N(P(r,['JEFATURA']))===N(j)).map(r=>P(r,['FUNDO']))),'Selecciona fundo');ra()}function ra(){let j=$('jefe').value,f=$('fundo').value;fill($('area'),U(R.filter(r=>(!j||N(P(r,['JEFATURA']))===N(j))&&(!f||N(P(r,['FUNDO']))===N(f))).map(r=>P(r,['AREA','ÁREA']))),'Selecciona área')}$('fundo').onchange=ra;
function jc(){let i=$('jefe'),l=$('jl');function dr(all){let q=all?'':N(i.value),v=U(R.map(r=>P(r,['JEFATURA']))).filter(x=>!q||N(x).includes(q));l.innerHTML=v.map(x=>'<div class="item" data-v="'+E(x)+'">'+E(x)+'</div>').join('');l.classList.add('open');l.querySelectorAll('[data-v]').forEach(x=>x.onmousedown=e=>{e.preventDefault();i.value=x.dataset.v;l.classList.remove('open');rf()})}i.onfocus=()=>dr(true);i.oninput=()=>dr(false);document.addEventListener('click',e=>{if(!i.parentElement.contains(e.target))l.classList.remove('open')})}
function rows(f,a){return M.filter(r=>N(me(r))==='ACTIVO').filter(r=>!f||N(mf(r))===N(f)).filter(r=>!a||!ma(r)||N(ma(r))===N(a))}function snap(){hist.push(JSON.stringify(A));if(hist.length>30)hist.shift();fut=[]}
$('addArea').onclick=()=>{let j=$('jefe').value.trim(),f=$('fundo').value,a=$('area').value;if(!j||!f||!a)return alert('Selecciona Jefatura, Fundo y Área.');snap();A.push({id:Date.now(),j,f,a,r:[]});render()};
window.addR=id=>{snap();A.find(x=>x.id===id).r.push({id:Date.now(),g:'',l:'',t:'DIA',q:[0,0,0,0,0,0,0]});render()};window.delR=(a,r)=>{snap();let x=A.find(z=>z.id===a);x.r=x.r.filter(z=>z.id!==r);render()};window.delA=id=>{snap();A=A.filter(x=>x.id!==id);render()};window.cp=(a,r)=>{let x=A.find(z=>z.id===a).r.find(z=>z.id===r);navigator.clipboard?.writeText([x.g,x.l,x.t,...x.q].join('\t'));$('status').textContent='Línea copiada.'};window.sr=(a,r,k,v)=>{let x=A.find(z=>z.id===a).r.find(z=>z.id===r);x[k]=v;if(k==='g')x.l='';render()};window.sq=(a,r,i,v)=>{A.find(z=>z.id===a).r.find(z=>z.id===r).q[i]=Math.max(0,+v||0);tot()};
function render(){let c=$('content'),days=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];if(!A.length){c.innerHTML='<div class="empty">Agrega un área para comenzar la programación.</div>';return}c.innerHTML=A.map(a=>{let mr=rows(a.f,a.a),gs=U(mr.map(mg));return '<div class="area"><div class="atitle"><span>'+E(a.f)+' · '+E(a.a)+' — '+E(a.j)+'</span><span><button class="blue" onclick="addR('+a.id+')">＋ Labor</button> <button class="red" onclick="delA('+a.id+')">×</button></span></div><div class="scroll"><table><thead><tr><th>Grupo labor</th><th>Labor</th><th>Turno</th>'+days.map((d,i)=>'<th class="num">'+D[i].getUTCDate()+'<small style="display:block">'+d+'</small></th>').join('')+'<th class="num">Total</th><th>Acciones</th></tr></thead><tbody>'+a.r.map(r=>{let ls=U(mr.filter(x=>!r.g||N(mg(x))===N(r.g)).map(ml));return '<tr><td><select class="sel" onchange="sr('+a.id+','+r.id+',\'g\',this.value)"><option></option>'+gs.map(x=>'<option '+(x===r.g?'selected':'')+'>'+E(x)+'</option>').join('')+'</select></td><td><select class="sel lab" onchange="sr('+a.id+','+r.id+',\'l\',this.value)"><option></option>'+ls.map(x=>'<option '+(x===r.l?'selected':'')+'>'+E(x)+'</option>').join('')+'</select></td><td><select onchange="sr('+a.id+','+r.id+',\'t\',this.value)"><option '+(r.t==='DIA'?'selected':'')+'>DIA</option><option '+(r.t==='NOCHE'?'selected':'')+'>NOCHE</option></select></td>'+r.q.map((q,i)=>'<td class="num"><input class="qty" type="number" min="0" value="'+q+'" onchange="sq('+a.id+','+r.id+','+i+',this.value)"></td>').join('')+'<td class="num rt" data-a="'+a.id+'" data-r="'+r.id+'"></td><td><button class="light" title="Copiar línea" onclick="cp('+a.id+','+r.id+')">📋</button> <button class="red" title="Borrar línea" onclick="delR('+a.id+','+r.id+')">🗑</button></td></tr>'}).join('')+'<tr class="subtotal"><td colspan="3">Subtotal área</td>'+[0,1,2,3,4,5,6].map(i=>'<td class="num as" data-a="'+a.id+'" data-i="'+i+'"></td>').join('')+'<td class="num at" data-a="'+a.id+'"></td><td></td></tr></tbody></table></div></div>'}).join('')+'<div class="scroll"><table><tbody><tr class="grand"><td colspan="3">TOTAL GENERAL</td>'+[0,1,2,3,4,5,6].map(i=>'<td class="num gd" data-i="'+i+'"></td>').join('')+'<td class="num" id="gt"></td><td></td></tr></tbody></table></div>';tot()}
function tot(){let gd=[0,0,0,0,0,0,0],gt=0;A.forEach(a=>{let s=[0,0,0,0,0,0,0],at=0;a.r.forEach(r=>{let t=r.q.reduce((z,x)=>z+(+x||0),0),e=document.querySelector('.rt[data-a="'+a.id+'"][data-r="'+r.id+'"]');if(e)e.textContent=t;r.q.forEach((x,i)=>s[i]+=+x||0);at+=t});s.forEach((x,i)=>{let e=document.querySelector('.as[data-a="'+a.id+'"][data-i="'+i+'"]');if(e)e.textContent=x;gd[i]+=x});let e=document.querySelector('.at[data-a="'+a.id+'"]');if(e)e.textContent=at;gt+=at});gd.forEach((x,i)=>{let e=document.querySelector('.gd[data-i="'+i+'"]');if(e)e.textContent=x});if($('gt'))$('gt').textContent=gt}
$('undo').onclick=()=>{if(hist.length){fut.push(JSON.stringify(A));A=JSON.parse(hist.pop());render()}};$('redo').onclick=()=>{if(fut.length){hist.push(JSON.stringify(A));A=JSON.parse(fut.pop());render()}};$('reset').onclick=$('clear').onclick=()=>{if(confirm('¿Limpiar la programación de la pantalla?')){snap();A=[];render()}};
$('folder').onclick=()=>{ $('csvLoad').value=''; $('csvLoad').click(); };

function detectDelimiter(t){
  const first=(t.split(/\r?\n/).find(x=>x.trim())||'');
  const opts=[[';',(first.match(/;/g)||[]).length],[',',(first.match(/,/g)||[]).length],['\t',(first.match(/\t/g)||[]).length]];
  return opts.sort((a,b)=>b[1]-a[1])[0][0];
}
function parseCSV(t){
  const d=detectDelimiter(t),rows=[];let row=[],field='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i],n=t[i+1];
    if(c==='"'){
      if(q&&n==='"'){field+='"';i++;} else q=!q;
    }else if(c===d&&!q){row.push(field);field='';}
    else if((c==='\n'||c==='\r')&&!q){
      if(c==='\r'&&n==='\n')i++;
      row.push(field);field='';
      if(row.some(v=>String(v).trim()!==''))rows.push(row);
      row=[];
    }else field+=c;
  }
  row.push(field);
  if(row.some(v=>String(v).trim()!==''))rows.push(row);
  if(!rows.length)return [];
  const h=rows[0].map(x=>String(x).replace(/^\uFEFF/,'').trim());
  return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]??'');return o;});
}
function csvVal(o,names){
  for(const n of names){
    const k=Object.keys(o).find(x=>N(x)===N(n));
    if(k)return o[k];
  }
  return '';
}
function validResponsible(j,f,a){
  return R.some(r=>N(P(r,['JEFATURA']))===N(j)&&N(P(r,['FUNDO']))===N(f)&&N(P(r,['AREA','ÁREA']))===N(a));
}
function activeLaborExists(f,a,g,l){
  return rows(f,a).some(x=>(!g||N(mg(x))===N(g))&&N(ml(x))===N(l));
}

$('csvLoad').onchange=async e=>{
  const file=e.target.files[0]; if(!file)return;
  try{
    const parsed=parseCSV(await file.text());
    if(!parsed.length) return alert('El CSV está vacío.');

    const keepQty=confirm(
      '¿Quieres conservar las cantidades del CSV?\n\n' +
      'Aceptar = conservar cantidades.\n' +
      'Cancelar = cargar solo la estructura con cantidades en 0.\n\n' +
      'La semana y las fechas serán las que tienes seleccionadas ahora.'
    );

    const sample=parsed[0];
    const headers=Object.keys(sample);
    const turnoIdx=headers.findIndex(h=>N(h)==='TURNO');
    const totalIdx=headers.findIndex(h=>N(h)==='TOTAL');
    let dayHeaders=[];
    if(turnoIdx>=0 && totalIdx>turnoIdx){
      dayHeaders=headers.slice(turnoIdx+1,totalIdx).slice(0,7);
    }
    if(dayHeaders.length<7){
      // Fallback: use numeric/date-looking headers after TURNO, excluding TOTAL.
      dayHeaders=headers.filter(h=>h!==headers[totalIdx] && (/\d{4}-\d{2}-\d{2}/.test(h)||/^\d{1,2}[\/-]\d{1,2}/.test(h))).slice(0,7);
    }

    const grouped=new Map();
    let skipped=0;
    parsed.forEach(r=>{
      const j=csvVal(r,['JEFATURA']);
      const f=csvVal(r,['FUNDO']);
      const a=csvVal(r,['AREA','ÁREA']);
      const g=csvVal(r,['GRUPO','GRUPO_LABOR','GRUPO LABOR']);
      const l=csvVal(r,['LABOR']);
      const t=csvVal(r,['TURNO'])||'DIA';

      if(!j||!f||!a||!l){ skipped++; return; }
      if(!validResponsible(j,f,a)){ skipped++; return; }
      if(!activeLaborExists(f,a,g,l)){ skipped++; return; }

      const key=[j,f,a].join('||');
      if(!grouped.has(key)) grouped.set(key,{j,f,a,rows:[]});
      const q=Array.from({length:7},(_,i)=>{
        if(!keepQty)return 0;
        const h=dayHeaders[i];
        return h ? Math.max(0,Number(String(r[h]??0).replace(',','.'))||0) : 0;
      });
      grouped.get(key).rows.push({id:Date.now()+Math.random(),g,l,t:N(t)==='NOCHE'?'NOCHE':'DIA',q});
    });

    const loaded=[...grouped.values()];
    if(!loaded.length){
      return alert('No se encontraron filas válidas. Revisa que Jefatura/Fundo/Área existan y que las labores sigan ACTIVAS.');
    }

    if(A.length && !confirm('Ya tienes programación en pantalla. ¿Deseas reemplazarla por el CSV cargado?')) return;

    snap();
    A=loaded.map((x,i)=>({id:Date.now()+i,j:x.j,f:x.f,a:x.a,r:x.rows}));
    render();
    $('status').textContent='✓ CSV cargado: '+A.reduce((s,x)=>s+x.r.length,0)+' líneas' +
      (keepQty?' con cantidades.':' con cantidades en 0.') +
      (skipped?(' · '+skipped+' fila(s) omitida(s).'):'');
  }catch(err){
    $('status').textContent='Error al cargar CSV: '+err.message;
    alert('No pude cargar el CSV: '+err.message);
  }
};

$('excel').onclick=()=>{let z=[['JEFATURA','FUNDO','AREA','GRUPO','LABOR','TURNO',...D.map(ISO),'TOTAL']];A.forEach(a=>a.r.forEach(r=>z.push([a.j,a.f,a.a,r.g,r.l,r.t,...r.q,r.q.reduce((s,x)=>s+x,0)])));let b=new Blob(['\ufeff'+z.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='Programacion_S'+$('wk').value+'.csv';x.click();URL.revokeObjectURL(u)};
$('save').onclick=async()=>{let z=[];A.forEach(a=>a.r.forEach(r=>{let m=rows(a.f,a.a).find(x=>N(mg(x))===N(r.g)&&N(ml(x))===N(r.l));r.q.forEach((q,i)=>{if(q>0)z.push({SEMANA:+$('wk').value,FECHA:String(D[i].getUTCDate()).padStart(2,'0')+'/'+String(D[i].getUTCMonth()+1).padStart(2,'0')+'/'+D[i].getUTCFullYear(),JEFATURA:a.j,FUNDO:a.f,AREA:a.a,COD_GRUPO_LABOR:m?mcg(m):'',GRUPO_LABOR:r.g,COD_LABOR:m?mcl(m):'',LABOR:r.l,TURNO:r.t,CANTIDAD:q})})}));if(!z.length)return alert('No hay cantidades para guardar.');$('status').textContent='Guardando…';await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({accion:'guardarProgramacion',registros:z})});$('status').textContent='✓ '+z.length+' registros enviados.'};
(async()=>{initWeek();try{[R,M]=await Promise.all([G('responsables'),G('maestro')]);$('conn').textContent='Conectado · '+R.length+' responsables · '+M.filter(r=>N(me(r))==='ACTIVO').length+' labores activas';$('conn').className='conn ok';fill($('fundo'),[],'Selecciona jefatura');fill($('area'),[],'Selecciona fundo');jc()}catch(e){$('conn').textContent='Error: '+e.message}})();
</script></body></html>
